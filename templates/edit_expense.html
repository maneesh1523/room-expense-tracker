{% extends "layout.html" %}
{% block content %}


<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
</head>
<body>

<h2>Edit Expense</h2>

<form method="POST">

    <label>Amount:</label><br>
    <input type="number" step="0.01" name="amount" value="{{ expense.amount }}" required><br><br>

    <label>Category:</label><br>
    <select name="category" required>
        <option value="{{ expense.category }}" selected>{{ expense.category }}</option>
        <option value="Groceries">Groceries</option>
        <option value="Food">Food</option>
        <option value="Rent">Rent</option>
        <option value="Electricity">Electricity</option>
        <option value="Gas">Gas</option>
        <option value="Cleaning">Cleaning</option>
        <option value="Misc">Misc</option>
    </select><br><br>

    <label>Date:</label><br>
    <input type="date" name="date" value="{{ expense.date }}" required><br><br>

    <label>Description:</label><br>
    <input type="text" name="description" value="{{ expense.description }}"><br><br>

    <button type="submit">Update Expense</button>
</form>

<br>
<a href="/expenses">Back</a>

</body>
</html>


{% endblock %}
