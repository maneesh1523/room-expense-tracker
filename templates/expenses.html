{% extends "layout.html" %}
{% block content %}

<h3 class="mb-4">Expenses</h3>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for e in expenses %}
        <tr>
            <td>{{ e.date }}</td>
            <td>{{ e.category }}</td>
            <td>₹{{ e.amount }}</td>
            <td>{{ e.description }}</td>
            <td>
                <a href="/edit-expense/{{ e.id }}" class="btn btn-sm btn-warning">Edit</a>
                <a href="/delete-expense/{{ e.id }}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a href="/add-expense" class="btn btn-primary">Add Expense</a>

{% endblock %}
